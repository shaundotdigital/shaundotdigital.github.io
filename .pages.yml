# Pages CMS (https://pagescms.org): edit the site's words in a web editor.
# Entries are grouped into folders in the Pages CMS sidebar: Homepage, Pages and Site-wide.
# Each entry is one file in src/data. Saving in Pages CMS commits it to the cms branch, and
# .github/workflows/cms-sync.yml then puts it live and copies it to dev.
# The films themselves aren't here: they fill themselves from Letterboxd when the site builds.

media:
  - name: images
    label: Images
    # Kept in src/assets so Astro can resize and compress them. The stored path
    # (e.g. /src/assets/shaun.jpeg) is what the site looks up when it builds.
    input: src/assets
    output: /src/assets
    categories: [image]

content:
  - name: home
    label: Homepage
    type: group
    # The homepage sections, in page order.
    items:
      - name: hero
        label: Hero
        type: file
        path: src/data/hero.json
        format: json
        fields:
          - name: roles
            label: What I do
            type: string
            list: true
            description: The short labels above the headline.
          - name: headlineStart
            label: Headline, before the pill
            type: string
            required: true
          - name: headlineHighlight
            label: Headline, in the black pill
            type: string
            description: Keep it short. The pill never wraps onto two lines.
            required: true
          - name: headlineEnd
            label: Headline, after the pill
            type: string
          - name: primaryButton
            label: Button
            type: string
            description: Jumps to the contact section.
          - name: secondaryLink
            label: Link beside the button
            type: string
            description: Jumps to the experience section.
          - name: card
            label: ID card (wide screens, the photo shows on all)
            type: object
            fields:
              - name: photo
                label: Photo
                type: image
                options:
                  media: images
              - name: photoAlt
                label: Photo description
                type: string
              - name: name
                label: Name
                type: string
              - name: jobTitle
                label: Job title
                type: string
              - name: basedIn
                label: Based in
                type: string
              - name: digitalSince
                label: In digital since
                type: string
              - name: workingOn
                label: Working on
                type: string
      - name: approach
        label: Approach
        type: file
        path: src/data/approach.json
        format: json
        fields:
          - name: heading
            label: Heading
            type: text
            required: true
          - name: intro
            label: Intro
            type: text
          - name: cards
            label: Cards
            type: object
            description: Shown four across on wide screens.
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Title
                type: string
                required: true
              - name: body
                label: Text
                type: text
                required: true
      - name: experience
        label: Experience
        type: file
        path: src/data/experience.json
        format: json
        fields:
          - name: heading
            label: Heading
            type: text
            required: true
          - name: entries
            label: Companies
            type: object
            description: Newest first. Tick Current on the job you have now to give it the orange marker.
            list:
              collapsible:
                collapsed: true
                summary: "{company} ({dates})"
            fields:
              - name: company
                label: Company
                type: string
                required: true
              - name: dates
                label: Dates
                type: string
                description: For example, Oct 2023 - Present
                required: true
              - name: note
                label: Note
                type: string
                description: Optional, e.g. Formerly Brakes Foodservice
              - name: current
                label: Current job
                type: boolean
              - name: roles
                label: Roles
                type: object
                description: Newest first. More than one role lists them under the company name.
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Job title
                    type: string
                    required: true
                  - name: dates
                    label: Dates
                    type: string
                    required: true
                  - name: summary
                    label: Summary
                    type: text
                    required: true
                  - name: tags
                    label: Tags
                    type: string
                    list: true
      - name: films
        label: Films section
        type: file
        path: src/data/films.json
        format: json
        fields:
          - name: heading
            label: Heading
            type: string
            description: The film count is added after this, e.g. "I watch a lot of films, 1,040 logged on Letterboxd so far."
            required: true
          - name: countText
            label: Text after the count
            type: string
          - name: favouritesLabel
            label: Favourites label
            type: string
          - name: recentLabel
            label: Recently watched label
            type: string
          - name: diaryLink
            label: Diary link
            type: string
      - name: contact
        label: Contact
        type: file
        path: src/data/contact.json
        format: json
        fields:
          - name: heading
            label: Heading
            type: text
            required: true
          - name: email
            label: Email address
            type: string
            description: Hidden from spam bots on the site. Only shown once the page has loaded.
            required: true
          - name: emailButton
            label: Button text without JavaScript
            type: string
            description: Most visitors see the email address on the button instead.
          - name: links
            label: Links
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: url
                label: Address
                type: string
                required: true
              - name: icon
                label: Logo
                type: select
                required: true
                options:
                  values:
                    - name: linkedin
                      label: LinkedIn
                    - name: letterboxd
                      label: Letterboxd
                    - name: github
                      label: GitHub
                    - name: bluesky
                      label: Bluesky

  - name: pages
    label: Pages
    type: group
    # Other pages. Blog posts and projects can go alongside these later.
    items:
      - name: privacy
        label: Privacy page
        type: file
        path: src/data/privacy.md
        format: yaml-frontmatter
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: description
            label: Description
            type: text
            description: Shown in search results.
          - name: body
            label: Page text
            type: rich-text
      - name: projects
        label: Projects
        type: collection
        path: src/data/projects
        format: json
        # New projects are saved as <title>.json. The page address comes from the Web address field, not the file name.
        filename: "{primary}.json"
        view:
          primary: title
          fields: [title, status, date]
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: slug
            label: Web address
            type: string
            description: Lowercase, words joined with hyphens, e.g. tri-uk. Becomes byshaun.xyz/projects/tri-uk. Don't change it once published.
            required: true
          - name: status
            label: Status
            type: select
            required: true
            description: Drafts only show when you run npm run dev. Choose Published to put it live.
            options:
              values:
                - name: draft
                  label: Draft
                - name: published
                  label: Published
          - name: summary
            label: Summary
            type: text
            description: The paragraph under the headline. Also used in search results.
          - name: order
            label: Order
            type: number
            description: Where it sits in the Projects list and the previous and next links. Lowest comes first. Projects without a number go last.
          - name: date
            label: Date
            type: date
            description: When the project finished. Sorts the list, newest first, after the Order number. It also starts the name of the project's picture folder, e.g. 2019-07-twitter-management.
            options:
              format: "yyyy-MM-dd"
          - name: showDate
            label: Show the date on the page
            type: boolean
            description: Turn on to show the month and year on the project's card and page. Leave off to keep the date to yourself.
          - name: image
            label: Card picture
            type: image
            description: Shown at the top of the project's card on the Projects page. Wide pictures work best, about 16 by 10. Leave empty for a card without one. Keep each project's pictures in its own folder, src/assets/projects/ then the year and month, then its web address, e.g. src/assets/projects/2019-07-twitter-management/card.jpg.
            options:
              media: images
          - name: imageAlt
            label: Card picture description
            type: string
            description: What the picture shows, for people who can't see it. Leave empty if it's only decoration.
          - name: category
            label: Category
            type: string
            description: Shown in the breadcrumb, e.g. Social media.
          - name: headlineStart
            label: Headline, before the pill
            type: string
          - name: headlineHighlight
            label: Headline, in the black pill
            type: string
            description: Keep it short. The pill never wraps onto two lines. Leave empty to show the title instead.
          - name: headlineEnd
            label: Headline, after the pill
            type: string
          - name: facts
            label: Fact tiles
            type: object
            description: The small cards under the headline, e.g. Client, My role, Timeline, Channel. Four fit across on wide screens.
            list:
              collapsible:
                collapsed: true
                summary: "{label}: {value}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: value
                label: Value
                type: string
                required: true
          - name: tags
            label: Skill tags
            type: string
            list: true
          - name: results
            label: Results band
            type: object
            description: The black band under the hero.
            fields:
              - name: main
                label: Headline figure
                type: object
                fields:
                  - name: value
                    label: Figure
                    type: string
                    description: For example +66%
                    required: true
                  - name: label
                    label: What it measures
                    type: text
                    required: true
              - name: others
                label: Supporting figures
                type: object
                description: Up to three, shown smaller beside the headline figure.
                list:
                  collapsible:
                    collapsed: true
                    summary: "{value} {label}"
                  max: 3
                fields:
                  - name: value
                    label: Figure
                    type: string
                    required: true
                  - name: label
                    label: What it measures
                    type: string
                    required: true
          - name: periods
            label: Names of the two periods
            type: object
            description: Used in chart legends and the change rows. Keep them short, they sit beside a bar.
            fields:
              - name: before
                label: Before
                type: string
              - name: after
                label: After
                type: string
          - name: trend
            label: "Chart: periods"
            type: object
            description: A column chart with a few wide columns, one per period. Hidden until filled in.
            fields:
              - name: heading
                label: Section heading
                type: string
                required: true
              - name: intro
                label: Section intro
                type: text
              - name: cards
                label: Period cards
                type: object
                description: Two cards above the chart, one per period, each with one big figure.
                list:
                  collapsible:
                    collapsed: true
                    summary: "{dates}: {value}"
                  max: 2
                fields:
                  - name: after
                    label: In the "after" period
                    type: boolean
                    description: Turn on for the black card. Leave off for the light one.
                  - name: dates
                    label: Dates
                    type: string
                    required: true
                    description: For example Jul 2014 to Jul 2017.
                  - name: value
                    label: Big figure
                    type: string
                    required: true
                  - name: measure
                    label: What it measures
                    type: string
                    required: true
                  - name: text
                    label: One more sentence
                    type: text
              - name: title
                label: Chart title
                type: string
                required: true
              - name: alt
                label: Description for screen readers
                type: text
                description: One or two sentences saying what the chart shows, for people who can't see it.
              - name: note
                label: Note under the chart
                type: string
              - name: pausedLabel
                label: Legend text for hatched columns
                type: string
                description: Shown in the legend when any column is hatched, e.g. Social media shelved.
              - name: bars
                label: Columns
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}: {value}"
                fields:
                  - name: label
                    label: Label
                    type: string
                    required: true
                    description: Shown under the column, e.g. Jan to Jun 2018.
                  - name: value
                    label: Value
                    type: number
                    required: true
                  - name: after
                    label: "In the \"after\" period"
                    type: boolean
                    description: Turn on to colour this column in the brand colour. Leave off for grey.
                  - name: paused
                    label: Hatched (explained in the note)
                    type: boolean
                    description: Turn on to hatch this column, for a month the note explains, e.g. when the work was shelved.
                  - name: tick
                    label: Axis label
                    type: string
                    description: Not used in this chart.
          - name: findings
            label: Findings (figure cards)
            type: object
            description: Cards with one big figure each. Hidden until filled in.
            fields:
              - name: heading
                label: Section heading
                type: string
                required: true
              - name: intro
                label: Section intro
                type: text
              - name: equalHeight
                label: Equal height cards
                type: boolean
                description: Turn on to make every card in a row as tall as the tallest. Comparison bars drop to the bottom of their card.
              - name: cards
                label: Cards
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{figure} {title}"
                fields:
                  - name: figure
                    label: Big figure
                    type: string
                    required: true
                    description: For example 36% or 0 to 27.
                  - name: title
                    label: What it is
                    type: string
                    required: true
                  - name: text
                    label: Explanation
                    type: text
                  - name: barsCaption
                    label: Caption under the bars
                    type: string
                  - name: bars
                    label: Comparison bars
                    type: object
                    description: Optional. Two or so bars comparing figures inside this card.
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{label}: {value}"
                    fields:
                      - name: label
                        label: Label
                        type: string
                        required: true
                      - name: value
                        label: Value
                        type: number
                        required: true
                        description: The biggest value fills the bar.
                      - name: display
                        label: Shown as
                        type: string
                        description: Optional. How the figure reads, e.g. 2.30 (a number field would drop the trailing zero).
                      - name: strong
                        label: Black bar
                        type: boolean
                        description: Turn on to draw this bar in black instead of grey.
          - name: changes
            label: Changes (before and after rows)
            type: object
            description: Rows comparing one figure before and after. Hidden until filled in.
            fields:
              - name: heading
                label: Section heading
                type: string
                required: true
              - name: intro
                label: Section intro
                type: text
              - name: rows
                label: Rows
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: What changed
                    type: string
                    required: true
                  - name: description
                    label: What the figure measures
                    type: string
                  - name: before
                    label: Before (number)
                    type: number
                    required: true
                  - name: after
                    label: After (number)
                    type: number
                    required: true
                  - name: unit
                    label: Unit
                    type: string
                    description: Added after both numbers, e.g. %. Leave empty for none.
                  - name: scale
                    label: Full bar equals
                    type: number
                    description: For percentages enter 100. Leave empty and the bigger number fills the bar.
          - name: monthly
            label: "Chart: months"
            type: object
            description: A chart with many thin columns, one per month, on a single timeline. Hidden until filled in.
            fields:
              - name: heading
                label: Section heading
                type: string
                required: true
              - name: intro
                label: Section intro
                type: text
              - name: title
                label: Chart title
                type: string
                required: true
              - name: alt
                label: Description for screen readers
                type: text
                description: One or two sentences saying what the chart shows, for people who can't see it.
              - name: note
                label: Note under the chart
                type: string
              - name: pausedLabel
                label: Legend text for hatched columns
                type: string
                description: Shown in the legend when any column is hatched, e.g. Social media shelved.
              - name: bars
                label: Columns
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{label}: {value}"
                fields:
                  - name: label
                    label: Label
                    type: string
                    required: true
                    description: Full month and year, e.g. December 2018. Shown in the hover text.
                  - name: value
                    label: Value
                    type: number
                    required: true
                  - name: after
                    label: "In the \"after\" period"
                    type: boolean
                    description: Turn on to colour this column in the brand colour. Leave off for grey.
                  - name: paused
                    label: Hatched (explained in the note)
                    type: boolean
                    description: Turn on to hatch this column, for a month the note explains, e.g. when the work was shelved.
          - name: tweets
            label: Tweets
            type: object
            description: Recreated tweets in a black band. Hidden until it has at least one tweet.
            fields:
              - name: heading
                label: Section heading
                type: string
                required: true
              - name: intro
                label: Section intro
                type: text
              - name: author
                label: Account name
                type: string
                description: For example TRI UK.
              - name: handle
                label: Handle
                type: string
                description: For example @triuk.
              - name: avatarImage
                label: Profile picture
                type: image
                description: The account's profile picture, shown in the round badge on every tweet. Square works best. Keep it in the project's own folder, e.g. src/assets/projects/2019-07-twitter-management/tweet-avatar.jpg.
                options:
                  media: images
              - name: avatar
                label: Avatar letters
                type: string
                description: Used only when there is no profile picture. Two or three letters shown in the round badge, e.g. TRI.
              - name: equalHeight
                label: Equal height cards
                type: boolean
                description: Turn on to make every tweet in a row as tall as the tallest. The time and counts line up along the bottom.
              - name: items
                label: Tweets
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "#{rank} {time}"
                fields:
                  - name: rank
                    label: Rank
                    type: number
                    description: Optional. Shown as #1, #2 and so on.
                  - name: text
                    label: Tweet text
                    type: text
                    required: true
                    description: Hashtags and @mentions turn blue on their own.
                  - name: time
                    label: Time and date
                    type: string
                    required: true
                    description: For example 5:17 pm · 11 Dec 2018.
                  - name: replies
                    label: Replies
                    type: number
                  - name: reposts
                    label: Retweets
                    type: number
                  - name: likes
                    label: Likes
                    type: number
                  - name: url
                    label: Link to the tweet
                    type: string
          - name: lessons
            label: Lessons
            type: object
            description: A list of short lessons, plus a note about the data. Hidden until filled in.
            fields:
              - name: heading
                label: Section heading
                type: string
                required: true
              - name: items
                label: Lessons
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{title}"
                fields:
                  - name: title
                    label: Lesson
                    type: string
                    required: true
                  - name: text
                    label: Why
                    type: text
                    required: true
              - name: note
                label: Note about the data
                type: text

  - name: sitewide
    label: Site-wide
    type: group
    # Shown on every page.
    items:
      - name: site
        label: Site settings
        type: file
        path: src/data/site.json
        format: json
        fields:
          - name: name
            label: Site name
            type: string
            description: Shown in browser tabs and when the site is shared.
            required: true
          - name: description
            label: Description
            type: text
            description: Shown in search results and link previews.
            required: true
          - name: shareImageAlt
            label: Share image description
            type: text
            description: Describes public/og-image.jpg for screen readers.
          - name: nav
            label: Menu
            type: object
            description: Only the labels can change. Each one jumps to a section of the homepage, or to its own page. Projects only shows once there is a project to see.
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Label
                type: string
                required: true
              - name: section
                label: Section
                type: string
                readonly: true
              - name: path
                label: Page
                type: string
                readonly: true
      - name: footer
        label: Footer
        type: file
        path: src/data/footer.json
        format: json
        fields:
          - name: copyright
            label: Copyright name
            type: string
            description: The year is added automatically.
          - name: builtWith
            label: Built with
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{label}"
            fields:
              - name: label
                label: Name
                type: string
                required: true
              - name: url
                label: Address
                type: string
                required: true
          - name: analyticsNotice
            label: Analytics notice
            type: text
          - name: privacyLink
            label: Privacy link text
            type: string
