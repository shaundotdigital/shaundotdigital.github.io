name: Deploy Astro to GitHub Pages

on:
  # Deploys on every push to the `live` branch
  push:
    branches: [ live ]
  # Rebuilds once a day so the Letterboxd section stays current (05:17 UTC)
  schedule:
    - cron: "17 5 * * *"
  # Allows a manual run from the Actions tab on GitHub
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Astro to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # GitHub switches off scheduled workflows after 60 days with no activity in the repo,
  # which would freeze the Letterboxd films. Re-enabling this workflow through the API
  # resets that 60-day count without making a commit. Only runs on the daily scheduled build.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily schedule switched on
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
