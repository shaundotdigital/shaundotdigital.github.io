name: Deploy Astro to GitHub Pages

on:
  # Deploys on every push to the `live` branch
  push:
    branches: [ live ]
  # Rebuilds twice a day so the Letterboxd section stays current. GitHub schedules run in
  # UTC: 11:07 and 23:07 UTC is 11:07am and 11:07pm in UK winter, an hour later in summer.
  # Minute 7 rather than 0 because runs at the top of the hour are more often delayed.
  schedule:
    - cron: "7 11,23 * * *"
  # Allows a manual run from the Actions tab on GitHub
  workflow_dispatch:

# Allow this job to clone the repo and create a page deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, build, and upload your site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Astro to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # GitHub switches off scheduled workflows after 60 days with no activity in the repo,
  # which would freeze the Letterboxd films. Re-enabling this workflow through the API
  # resets that 60-day count without making a commit. Only runs on the daily scheduled build.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the daily schedule switched on
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
